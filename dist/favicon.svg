<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="sbGradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="8" y1="28" x2="40" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Outer soft pill container -->
  <rect x="2" y="2" width="44" height="44" rx="14" fill="#ffffff" stroke="#e0e7ff" stroke-width="2" />
  
  <!-- Suspension Bridge Cable Arch -->
  <path d="M 8 32 C 18 18, 30 18, 40 32" stroke="url(#bridgeGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85" />
  <line x1="16" y1="24" x2="16" y2="33" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="24" y1="21" x2="24" y2="33" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="24" x2="32" y2="33" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Bridge Roadway deck -->
  <path d="M 6 34 L 42 34" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Stylized Heart-Hand Sign Bridge in center -->
  <g filter="url(#glow)">
    <!-- Left Hand Wave/Sign -->
    <path d="M 17 21 C 15 18, 14 13, 17 11 C 19 9, 21 12, 22 15" stroke="url(#sbGradient)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Center Sign Bridge Arch -->
    <path d="M 22 14 C 23 10, 26 10, 27 14 C 28 17, 28 20, 26 23" stroke="url(#sbGradient)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Right Hand Extension -->
    <path d="M 27 14 C 29 11, 32 11, 33 14 C 34 17, 32 20, 29 23 L 24 27 L 19 23" stroke="url(#sbGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>